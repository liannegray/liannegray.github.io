<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Children 0–17 Age Pyramid – Barnsley</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #ffffff; color: #1e1e2e;
  font-family: 'Segoe UI', sans-serif;
  display: flex; flex-direction: column;
}

/* ── Column headers ── */
#col-headers {
  display: grid;
  grid-template-columns: 42% 16% 42%;
  padding: 8px 16px 4px;
  flex-shrink: 0;
}
.chart-col-hdr {
  font-family: 'Segoe UI Semibold', 'Segoe UI', sans-serif;
  font-weight: 600;
  font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase;
}
.chart-col-hdr.male   { color: #0061AD;   text-align: right; padding-right: 8px; }
.chart-col-hdr.centre { color: #94a3b8; text-align: center; font-size: 10px; }
.chart-col-hdr.female { color: #4F1F6A; text-align: left;  padding-left: 8px; }

/* ── Pyramid ── */
#pyramid {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column-reverse;
  gap: 6px;
  padding: 4px 16px 6px;
}
.age-row {
  display: grid;
  grid-template-columns: 42% 16% 42%;
  flex: 1; min-height: 0;
  align-items: center;
}

/* Male side — bars grow LEFT */
.male-cell {
  display: flex; flex-direction: row-reverse;
  align-items: center; height: 100%;
}
.male-bar {
  height: 70%; max-height: 52px; min-height: 26px;
  background: rgba(0,97,173,0.80);
  border-radius: 4px 0 0 4px;
  transition: width 0.6s cubic-bezier(.4,0,.2,1);
  display: flex; align-items: center; justify-content: flex-start;
  position: relative; min-width: 0;
}
.male-bar-lbl {
  font-family: 'Segoe UI Semibold', 'Segoe UI', sans-serif;
  font-weight: 600; font-size: 11px; color: #ffffff;
  padding-left: 6px; white-space: nowrap; pointer-events: none;
}
.male-bar-lbl.outside {
  color: #0061AD; padding-left: 0; margin-right: 4px;
  position: absolute; right: 100%;
}

/* Centre label */
.band-cell {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 1px;
}
.band-age {
  font-family: 'Segoe UI Semibold', 'Segoe UI', sans-serif;
  font-weight: 600; font-size: 11px; color: #374151;
  text-align: center;
}
.band-phase {
  font-size: 9px; color: #94a3b8; text-align: center;
  white-space: nowrap;
}

/* Female side — bars grow RIGHT */
.female-cell {
  display: flex; flex-direction: row;
  align-items: center; height: 100%;
}
.female-bar {
  height: 70%; max-height: 52px; min-height: 26px;
  background: rgba(79,31,106,0.80);
  border-radius: 0 4px 4px 0;
  transition: width 0.6s cubic-bezier(.4,0,.2,1);
  display: flex; align-items: center; justify-content: flex-end;
  position: relative; min-width: 0;
}
.female-bar-lbl {
  font-family: 'Segoe UI Semibold', 'Segoe UI', sans-serif;
  font-weight: 600; font-size: 11px; color: #ffffff;
  padding-right: 6px; white-space: nowrap; pointer-events: none;
}
.female-bar-lbl.outside {
  color: #4F1F6A; padding-right: 0; margin-left: 4px;
  position: absolute; left: 100%;
}

/* ── Footer ── */
#footer {
  flex-shrink: 0;
  padding: 5px 16px 7px;
  border-top: 1px solid #f1f5f9;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.legend-dot {
  display: inline-block; width: 10px; height: 10px;
  border-radius: 50%; flex-shrink: 0;
}
.legend-item {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; color: #475569;
}
.legend-item strong {
  font-family: 'Segoe UI Semibold', 'Segoe UI', sans-serif;
  font-weight: 600; color: #1e1e2e;
}
.geo-label {
  font-family: 'Segoe UI Semibold', 'Segoe UI', sans-serif;
  font-weight: 600; font-size: 11px; color: #360071;
  margin-left: auto;
}
</style>
</head>
<body>

<div id="col-headers">
  <div class="chart-col-hdr male">Male</div>
  <div class="chart-col-hdr centre">Age band</div>
  <div class="chart-col-hdr female">Female</div>
</div>

<div id="pyramid"></div>

<div id="footer">
  <div class="legend-item">
    <span class="legend-dot" style="background:rgba(0,97,173,0.80)"></span>
    <span>Male <strong id="total-male">0</strong></span>
  </div>
  <div class="legend-item">
    <span class="legend-dot" style="background:rgba(79,31,106,0.80)"></span>
    <span>Female <strong id="total-female">0</strong></span>
  </div>
  <div class="geo-label" id="geo-label">Barnsley Borough</div>
</div>

<script>
const ALL_DATA  = {"South": {"11\u201315": {"Male": 1421, "Female": 1367}, "16\u201317": {"Male": 553, "Female": 507}, "0\u20134": {"Male": 1299, "Female": 1238}, "5\u201310": {"Male": 1633, "Female": 1576}}, "North": {"11\u201315": {"Male": 1386, "Female": 1333}, "16\u201317": {"Male": 547, "Female": 501}, "0\u20134": {"Male": 1216, "Female": 1159}, "5\u201310": {"Male": 1555, "Female": 1501}}, "North East": {"11\u201315": {"Male": 2102, "Female": 2023}, "16\u201317": {"Male": 812, "Female": 743}, "0\u20134": {"Male": 1912, "Female": 1823}, "5\u201310": {"Male": 2491, "Female": 2404}}, "Central": {"11\u201315": {"Male": 1945, "Female": 1870}, "16\u201317": {"Male": 773, "Female": 710}, "0\u20134": {"Male": 1793, "Female": 1709}, "5\u201310": {"Male": 2263, "Female": 2184}}, "Penistone": {"11\u201315": {"Male": 833, "Female": 801}, "16\u201317": {"Male": 303, "Female": 277}, "0\u20134": {"Male": 564, "Female": 537}, "5\u201310": {"Male": 882, "Female": 852}}, "Dearne": {"11\u201315": {"Male": 824, "Female": 793}, "16\u201317": {"Male": 307, "Female": 281}, "0\u20134": {"Male": 820, "Female": 781}, "5\u201310": {"Male": 956, "Female": 923}}, "Dearne North": {"5\u201310": {"Male": 508, "Female": 492}, "11\u201315": {"Male": 425, "Female": 409}, "16\u201317": {"Male": 168, "Female": 154}, "0\u20134": {"Male": 453, "Female": 431}}, "Monk Bretton": {"5\u201310": {"Male": 456, "Female": 440}, "11\u201315": {"Male": 387, "Female": 373}, "16\u201317": {"Male": 149, "Female": 137}, "0\u20134": {"Male": 348, "Female": 332}}, "St Helens": {"5\u201310": {"Male": 495, "Female": 478}, "11\u201315": {"Male": 418, "Female": 402}, "16\u201317": {"Male": 161, "Female": 147}, "0\u20134": {"Male": 375, "Female": 357}}, "Penistone East": {"5\u201310": {"Male": 387, "Female": 374}, "11\u201315": {"Male": 395, "Female": 380}, "16\u201317": {"Male": 153, "Female": 140}, "0\u20134": {"Male": 246, "Female": 235}}, "Stairfoot": {"5\u201310": {"Male": 544, "Female": 524}, "11\u201315": {"Male": 425, "Female": 409}, "0\u20134": {"Male": 381, "Female": 362}, "16\u201317": {"Male": 159, "Female": 146}}, "Dearne South": {"5\u201310": {"Male": 448, "Female": 431}, "11\u201315": {"Male": 398, "Female": 384}, "16\u201317": {"Male": 139, "Female": 128}, "0\u20134": {"Male": 367, "Female": 351}}, "Hoyland Milton": {"5\u201310": {"Male": 395, "Female": 381}, "11\u201315": {"Male": 345, "Female": 333}, "16\u201317": {"Male": 131, "Female": 120}, "0\u20134": {"Male": 307, "Female": 293}}, "Worsbrough": {"5\u201310": {"Male": 343, "Female": 333}, "11\u201315": {"Male": 296, "Female": 285}, "16\u201317": {"Male": 123, "Female": 112}, "0\u20134": {"Male": 241, "Female": 230}}, "Old Town": {"5\u201310": {"Male": 379, "Female": 365}, "11\u201315": {"Male": 338, "Female": 326}, "16\u201317": {"Male": 141, "Female": 128}, "0\u20134": {"Male": 295, "Female": 282}}, "Dodworth": {"5\u201310": {"Male": 343, "Female": 329}, "11\u201315": {"Male": 329, "Female": 317}, "16\u201317": {"Male": 131, "Female": 120}, "0\u20134": {"Male": 227, "Female": 217}}, "Kingstone": {"5\u201310": {"Male": 361, "Female": 349}, "11\u201315": {"Male": 331, "Female": 318}, "16\u201317": {"Male": 121, "Female": 112}, "0\u20134": {"Male": 312, "Female": 298}}, "Rockingham": {"11\u201315": {"Male": 354, "Female": 341}, "16\u201317": {"Male": 148, "Female": 135}, "5\u201310": {"Male": 395, "Female": 382}, "0\u20134": {"Male": 295, "Female": 282}}, "Darton East": {"11\u201315": {"Male": 336, "Female": 323}, "16\u201317": {"Male": 135, "Female": 123}, "5\u201310": {"Male": 364, "Female": 351}, "0\u20134": {"Male": 299, "Female": 284}}, "Darton West": {"0\u20134": {"Male": 247, "Female": 235}, "5\u201310": {"Male": 318, "Female": 307}, "11\u201315": {"Male": 291, "Female": 281}, "16\u201317": {"Male": 111, "Female": 102}}, "Darfield": {"5\u201310": {"Male": 406, "Female": 392}, "11\u201315": {"Male": 348, "Female": 335}, "16\u201317": {"Male": 128, "Female": 118}, "0\u20134": {"Male": 314, "Female": 299}}, "Penistone West": {"5\u201310": {"Male": 495, "Female": 479}, "11\u201315": {"Male": 438, "Female": 421}, "16\u201317": {"Male": 151, "Female": 138}, "0\u20134": {"Male": 317, "Female": 304}}, "Wombwell": {"5\u201310": {"Male": 435, "Female": 420}, "11\u201315": {"Male": 371, "Female": 358}, "0\u20134": {"Male": 383, "Female": 366}, "16\u201317": {"Male": 147, "Female": 135}}, "Cudworth": {"0\u20134": {"Male": 363, "Female": 347}, "5\u201310": {"Male": 467, "Female": 450}, "11\u201315": {"Male": 401, "Female": 386}, "16\u201317": {"Male": 153, "Female": 140}}, "Royston": {"5\u201310": {"Male": 435, "Female": 421}, "11\u201315": {"Male": 382, "Female": 368}, "16\u201317": {"Male": 152, "Female": 139}, "0\u20134": {"Male": 322, "Female": 308}}, "Barnsley": {"0\u20134": {"Male": 6847, "Female": 6529}, "5\u201310": {"Male": 8876, "Female": 8570}, "11\u201315": {"Male": 7764, "Female": 7468}, "16\u201317": {"Male": 2999, "Female": 2746}}};
const BAND_META = [{"label": "0\u20134", "phase": "Early Years"}, {"label": "5\u201310", "phase": "Primary School"}, {"label": "11\u201315", "phase": "Secondary School"}, {"label": "16\u201317", "phase": "Post 16+"}];

const _params  = new URLSearchParams(window.location.search);
const SEL_NAME = decodeURIComponent((_params.get("name") || "Barnsley").replace(/\+/g," "));
const SEL_TYPE = decodeURIComponent((_params.get("type") || "Local Authority").replace(/\+/g," "));

function resolveData() {
  if (ALL_DATA[SEL_NAME]) return ALL_DATA[SEL_NAME];
  return ALL_DATA["Barnsley"] || {};
}

function buildPyramid() {
  const rows = resolveData();

  // Geo label in footer
  const typeLabel = SEL_TYPE === "Local Authority" ? "Borough"
                  : SEL_TYPE === "Area Council"    ? "Area Council"
                  : SEL_TYPE === "Ward"            ? "Ward" : "";
  document.getElementById("geo-label").textContent =
    SEL_NAME === "Barnsley" ? "Barnsley Borough"
    : typeLabel ? SEL_NAME + " " + typeLabel : SEL_NAME;

  const maleCounts   = BAND_META.map(b => (rows[b.label] || {})["Male"]   || 0);
  const femaleCounts = BAND_META.map(b => (rows[b.label] || {})["Female"] || 0);

  const totalMale   = maleCounts.reduce((s,v) => s+v, 0);
  const totalFemale = femaleCounts.reduce((s,v) => s+v, 0);
  document.getElementById("total-male").textContent   = totalMale.toLocaleString();
  document.getElementById("total-female").textContent = totalFemale.toLocaleString();

  const maxVal = Math.max(...maleCounts, ...femaleCounts, 1);
  const pyramid = document.getElementById("pyramid");
  pyramid.innerHTML = "";

  BAND_META.forEach((band, i) => {
    const m = maleCounts[i];
    const f = femaleCounts[i];
    const mPct = Math.round(m / maxVal * 100);
    const fPct = Math.round(f / maxVal * 100);
    const mInside = mPct >= 18;
    const fInside = fPct >= 18;

    const row = document.createElement("div");
    row.className = "age-row";

    // Male cell
    const mCell = document.createElement("div");
    mCell.className = "male-cell";
    const mBar = document.createElement("div");
    mBar.className = "male-bar";
    mBar.style.width = "0%";
    mBar.style.transitionDelay = (i * 60) + "ms";
    const mLbl = document.createElement("span");
    mLbl.className = "male-bar-lbl" + (mInside ? "" : " outside");
    mLbl.textContent = m.toLocaleString();
    mBar.appendChild(mLbl);
    mCell.appendChild(mBar);

    // Centre band label
    const bandCell = document.createElement("div");
    bandCell.className = "band-cell";
    const ageSpan   = document.createElement("div");
    ageSpan.className = "band-age";
    ageSpan.textContent = band.label;
    const phaseSpan = document.createElement("div");
    phaseSpan.className = "band-phase";
    phaseSpan.textContent = band.phase;
    bandCell.appendChild(ageSpan);
    bandCell.appendChild(phaseSpan);

    // Female cell
    const fCell = document.createElement("div");
    fCell.className = "female-cell";
    const fBar = document.createElement("div");
    fBar.className = "female-bar";
    fBar.style.width = "0%";
    fBar.style.transitionDelay = (i * 60) + "ms";
    const fLbl = document.createElement("span");
    fLbl.className = "female-bar-lbl" + (fInside ? "" : " outside");
    fLbl.textContent = f.toLocaleString();
    fBar.appendChild(fLbl);
    fCell.appendChild(fBar);

    row.appendChild(mCell);
    row.appendChild(bandCell);
    row.appendChild(fCell);
    pyramid.appendChild(row);

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        mBar.style.width = mPct + "%";
        fBar.style.width = fPct + "%";
      });
    });
  });
}

buildPyramid();
</script>
</body>
</html>

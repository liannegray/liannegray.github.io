const COLOURS = {
  population: ["#fff7ec","#fee8c8","#fdd49e","#fdbb84","#fc8d59","#ef6548","#d7301f","#990000"],
  households: ["#f7fbff","#deebf7","#c6dbef","#9ecae1","#6baed6","#4292c6","#2171b5","#084594"]
};

let mode = "population";
let geoLayer = null;

const map = L.map("map", { zoomControl: true }).setView([53.55, -1.48], 11);

L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO | Data: ONS / Barnsley MBC',
  maxZoom: 18
}).addTo(map);

function getValues(modeKey) {
  const key = modeKey === "population" ? "population_density_per_ha" : "household_density_per_ha";
  return geojsonData.features
    .map(f => f.properties[key])
    .filter(v => v != null && v > 0);
}

function getColour(value, min, max, modeKey) {
  if (value == null) return "#cccccc";
  const scale = COLOURS[modeKey];
  const ratio = Math.max(0, Math.min(1, (value - min) / (max - min)));
  const idx = Math.min(Math.floor(ratio * scale.length), scale.length - 1);
  return scale[idx];
}

function buildLegend(min, max, modeKey) {
  const scale = COLOURS[modeKey];
  const items = document.getElementById("legend-items");
  document.getElementById("legend-title").textContent =
    modeKey === "population" ? "Population Density" : "Household Density";
  items.innerHTML = "";
  scale.forEach((colour, i) => {
    const lo = (min + (max - min) * i / scale.length).toFixed(1);
    const hi = (min + (max - min) * (i + 1) / scale.length).toFixed(1);
    items.innerHTML += `<div class="legend-item">
      <div class="legend-swatch" style="background:${colour}"></div>
      <span>${lo} – ${hi}</span>
    </div>`;
  });
}

function fmt(n) { return n != null ? Number(n).toLocaleString() : "—"; }
function fmtD(n) { return n != null ? Number(n).toFixed(2) : "—"; }

function showInfo(props) {
  document.getElementById("info-box").style.display = "block";
  document.getElementById("info-name").textContent = props.lsoa_name || props.LSOA21NM || "—";
  document.getElementById("info-ward").textContent = props.ward_name || "—";
  document.getElementById("info-ac").textContent = props.area_council_name || "—";
  document.getElementById("info-pop").textContent = fmt(props.total_population);
  document.getElementById("info-popdensity").textContent = fmtD(props.population_density_per_ha) + " / ha";
  document.getElementById("info-hh").textContent = fmt(props.total_households);
  document.getElementById("info-hhdensity").textContent = fmtD(props.household_density_per_ha) + " / ha";
  document.getElementById("info-pphh").textContent = fmtD(props.persons_per_household);
  document.getElementById("info-area").textContent = fmtD(props.area_hectares) + " ha";
}

function renderMap() {
  const values = getValues(mode);
  const min = Math.min(...values);
  const max = Math.max(...values);
  const key = mode === "population" ? "population_density_per_ha" : "household_density_per_ha";

  if (geoLayer) map.removeLayer(geoLayer);

  geoLayer = L.geoJSON(geojsonData, {
    style: feature => ({
      fillColor: getColour(feature.properties[key], min, max, mode),
      fillOpacity: 0.75,
      color: "#555",
      weight: 0.8
    }),
    onEachFeature: (feature, layer) => {
      layer.on({
        mouseover: e => {
          e.target.setStyle({ weight: 2.5, color: "#222", fillOpacity: 0.9 });
          showInfo(feature.properties);
        },
        mouseout: e => {
          geoLayer.resetStyle(e.target);
          document.getElementById("info-box").style.display = "none";
        },
        click: e => {
          map.fitBounds(e.target.getBounds(), { padding: [30, 30] });
        }
      });
    }
  }).addTo(map);

  buildLegend(min, max, mode);
}

function setMode(newMode) {
  mode = newMode;
  document.getElementById("btn-pop").className = "toggle-btn " + (mode === "population" ? "active-pop" : "inactive");
  document.getElementById("btn-hh").className  = "toggle-btn " + (mode === "households"  ? "active-hh"  : "inactive");
  renderMap();
}

renderMap();
</script>

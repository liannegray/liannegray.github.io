<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Children 0–17 Age Detail – Barnsley</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #ffffff; color: #1e1e2e;
  font-family: 'Segoe UI', sans-serif;
  display: flex; flex-direction: column;
}

/* ── Column headers ── */
#col-headers {
  display: grid;
  grid-template-columns: 40% 12% 40% 8%;
  padding: 8px 12px 4px;
  flex-shrink: 0;
  align-items: end;
}
.chart-col-hdr {
  font-family: 'Segoe UI Semibold', 'Segoe UI', sans-serif;
  font-weight: 600;
  font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase;
}
.chart-col-hdr.male   { color: #0061AD;   text-align: right; padding-right: 6px; }
.chart-col-hdr.centre { color: #94a3b8; text-align: center; font-size: 10px; }
.chart-col-hdr.female { color: #4F1F6A; text-align: left;  padding-left: 6px; }
.chart-col-hdr.phase-hdr {
  color: #94a3b8; text-align: right; font-size: 10px;
  padding-right: 4px;
}

/* ── Pyramid ── */
#pyramid {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  padding: 2px 12px 4px;
  gap: 0;
  overflow: hidden;
}

/* Phase section separator */
.phase-separator {
  flex-shrink: 0;
  display: grid;
  grid-template-columns: 40% 12% 40% 8%;
  align-items: center;
  height: 22px;
  margin: 3px 0 1px;
}
.phase-line {
  height: 1px;
  background: linear-gradient(to left, #e2e8f0, transparent);
  grid-column: 1;
}
.phase-line-right {
  height: 1px;
  background: linear-gradient(to right, #e2e8f0, transparent);
  grid-column: 3;
}
.phase-centre-dot {
  text-align: center;
  font-size: 10px;
  color: #94a3b8;
  grid-column: 2;
}
.phase-label {
  font-family: 'Segoe UI Semibold', 'Segoe UI', sans-serif;
  font-weight: 600;
  font-size: 10px;
  color: #64748b;
  text-align: right;
  padding-right: 4px;
  grid-column: 4;
  white-space: nowrap;
  letter-spacing: 0.01em;
}

/* Age rows */
.age-row {
  display: grid;
  grid-template-columns: 40% 12% 40% 8%;
  flex: 1; min-height: 0;
  align-items: center;
}

/* Male side */
.male-cell {
  display: flex; flex-direction: row-reverse;
  align-items: center; height: 100%;
}
.male-bar {
  height: 65%; max-height: 40px; min-height: 14px;
  background: rgba(0,97,173,0.80);
  border-radius: 3px 0 0 3px;
  transition: width 0.55s cubic-bezier(.4,0,.2,1);
  display: flex; align-items: center; justify-content: flex-start;
  position: relative; min-width: 0;
}
.male-bar-lbl {
  font-family: 'Segoe UI Semibold', 'Segoe UI', sans-serif;
  font-weight: 600; font-size: 10px; color: #ffffff;
  padding-left: 4px; white-space: nowrap; pointer-events: none;
}
.male-bar-lbl.outside {
  color: #0061AD; padding-left: 0; margin-right: 3px;
  position: absolute; right: 100%;
}

/* Age number */
.age-lbl-cell {
  text-align: center;
  font-size: 10px; font-weight: 600; color: #64748b;
}

/* Female side */
.female-cell {
  display: flex; flex-direction: row;
  align-items: center; height: 100%;
}
.female-bar {
  height: 65%; max-height: 40px; min-height: 14px;
  background: rgba(79,31,106,0.80);
  border-radius: 0 3px 3px 0;
  transition: width 0.55s cubic-bezier(.4,0,.2,1);
  display: flex; align-items: center; justify-content: flex-end;
  position: relative; min-width: 0;
}
.female-bar-lbl {
  font-family: 'Segoe UI Semibold', 'Segoe UI', sans-serif;
  font-weight: 600; font-size: 10px; color: #ffffff;
  padding-right: 4px; white-space: nowrap; pointer-events: none;
}
.female-bar-lbl.outside {
  color: #4F1F6A; padding-right: 0; margin-left: 3px;
  position: absolute; left: 100%;
}

/* Phase bracket — right column, spans age rows */
.phase-bracket {
  grid-column: 4;
  display: flex; align-items: center; justify-content: flex-end;
  height: 100%;
  padding-right: 4px;
}
.phase-bracket-line {
  width: 3px;
  height: 80%;
  border-right: 2px solid #e2e8f0;
  border-top: 2px solid #e2e8f0;
  border-bottom: 2px solid #e2e8f0;
  border-radius: 0 3px 3px 0;
}

/* ── Footer ── */
#footer {
  flex-shrink: 0;
  padding: 5px 12px 7px;
  border-top: 1px solid #f1f5f9;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.legend-dot {
  display: inline-block; width: 9px; height: 9px;
  border-radius: 50%; flex-shrink: 0;
}
.legend-item {
  display: flex; align-items: center; gap: 4px;
  font-size: 11px; color: #475569;
}
.legend-item strong {
  font-family: 'Segoe UI Semibold', 'Segoe UI', sans-serif;
  font-weight: 600; color: #1e1e2e;
}
.geo-label {
  font-family: 'Segoe UI Semibold', 'Segoe UI', sans-serif;
  font-weight: 600; font-size: 11px; color: #360071;
  margin-left: auto;
}
</style>
</head>

</div>

<div id="pyramid"></div>

  <div class="geo-label" id="geo-label">Barnsley Borough</div>
</div>

const PHASES   = [{"minAge": 16, "maxAge": 17, "label": "Post 16+", "range": "16\u201317"}, {"minAge": 11, "maxAge": 15, "label": "Secondary School Age", "range": "11\u201315"}, {"minAge": 5, "maxAge": 10, "label": "Primary School Age", "range": "5\u201310"}, {"minAge": 0, "maxAge": 4, "label": "Early Years", "range": "0\u20134"}];

const _params  = new URLSearchParams(window.location.search);
const SEL_NAME = decodeURIComponent((_params.get("name") || "Barnsley").replace(/\+/g," "));
const SEL_TYPE = decodeURIComponent((_params.get("type") || "Local Authority").replace(/\+/g," "));

function resolveData() {
  return ALL_DATA[SEL_NAME] || ALL_DATA["Barnsley"] || {};
}

function buildPyramid() {
  const rows = resolveData();

  // Geo label
  const typeLabel = SEL_TYPE === "Local Authority" ? "Borough"
                  : SEL_TYPE === "Area Council"    ? "Area Council"
                  : SEL_TYPE === "Ward"            ? "Ward" : "";
  document.getElementById("geo-label").textContent =
    SEL_NAME === "Barnsley" ? "Barnsley Borough"
    : typeLabel ? SEL_NAME + " " + typeLabel : SEL_NAME;

  // Totals
  let totalMale = 0, totalFemale = 0;
  for (let a = 0; a <= 17; a++) {
    totalMale   += (rows[a] || {})["Male"]   || 0;
    totalFemale += (rows[a] || {})["Female"] || 0;
  }
  document.getElementById("total-male").textContent   = totalMale.toLocaleString();
  document.getElementById("total-female").textContent = totalFemale.toLocaleString();

  // Max for scaling
  let maxVal = 1;
  for (let a = 0; a <= 17; a++) {
    maxVal = Math.max(maxVal,
      (rows[a] || {})["Male"]   || 0,
      (rows[a] || {})["Female"] || 0
    );
  }

  const pyramid = document.getElementById("pyramid");
  pyramid.innerHTML = "";

  // Build top-to-bottom: oldest phase first, youngest last
  // PHASES array is already ordered oldest→youngest
  let animIdx = 0;
  PHASES.forEach(phase => {
    // Phase separator row
    const sep = document.createElement("div");
    sep.className = "phase-separator";
    sep.innerHTML = `
      <div class="phase-line"></div>
      <div class="phase-centre-dot">·</div>
      <div class="phase-line-right"></div>
      <div class="phase-label">${phase.label}</div>
    `;
    pyramid.appendChild(sep);

    // Age rows within this phase, oldest first (top of visual)
    for (let age = phase.maxAge; age >= phase.minAge; age--) {
      const m = (rows[age] || {})["Male"]   || 0;
      const f = (rows[age] || {})["Female"] || 0;
      const mPct    = Math.round(m / maxVal * 100);
      const fPct    = Math.round(f / maxVal * 100);
      const mInside = mPct >= 16;
      const fInside = fPct >= 16;
      const delay   = animIdx * 30;

      const row = document.createElement("div");
      row.className = "age-row";

      // Male cell
      const mCell = document.createElement("div");
      mCell.className = "male-cell";
      const mBar = document.createElement("div");
      mBar.className = "male-bar";
      mBar.style.width = "0%";
      mBar.style.transitionDelay = delay + "ms";
      const mLbl = document.createElement("span");
      mLbl.className = "male-bar-lbl" + (mInside ? "" : " outside");
      mLbl.textContent = m.toLocaleString();
      mBar.appendChild(mLbl);
      mCell.appendChild(mBar);

      // Age label
      const ageLbl = document.createElement("div");
      ageLbl.className = "age-lbl-cell";
      ageLbl.textContent = age;

      // Female cell
      const fCell = document.createElement("div");
      fCell.className = "female-cell";
      const fBar = document.createElement("div");
      fBar.className = "female-bar";
      fBar.style.width = "0%";
      fBar.style.transitionDelay = delay + "ms";
      const fLbl = document.createElement("span");
      fLbl.className = "female-bar-lbl" + (fInside ? "" : " outside");
      fLbl.textContent = f.toLocaleString();
      fBar.appendChild(fLbl);
      fCell.appendChild(fBar);

      // Phase bracket (right column — empty spacer to maintain grid)
      const bracket = document.createElement("div");
      bracket.className = "phase-bracket";

      row.appendChild(mCell);
      row.appendChild(ageLbl);
      row.appendChild(fCell);
      row.appendChild(bracket);
      pyramid.appendChild(row);

      animIdx++;
    }
  });

  // Animate bars in after two rAF ticks (ensures layout is ready)
  const maleBars   = pyramid.querySelectorAll(".male-bar");
  const femaleBars = pyramid.querySelectorAll(".female-bar");
  let bi = 0;
  PHASES.forEach(phase => {
    for (let age = phase.maxAge; age >= phase.minAge; age--) {
      const m = (rows[age] || {})["Male"]   || 0;
      const f = (rows[age] || {})["Female"] || 0;
      const mPct = Math.round(m / maxVal * 100);
      const fPct = Math.round(f / maxVal * 100);
      if (maleBars[bi])   maleBars[bi]._target   = mPct + "%";
      if (femaleBars[bi]) femaleBars[bi]._target = fPct + "%";
      bi++;
    }
  });

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      maleBars.forEach(b   => { if (b._target) b.style.width = b._target; });
      femaleBars.forEach(b => { if (b._target) b.style.width = b._target; });
    });
  });
}

buildPyramid();
</script>
